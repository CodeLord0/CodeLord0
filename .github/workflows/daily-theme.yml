name: Daily GitHub Stats Theme

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at 00:00 UTC
  workflow_dispatch:     # Optional manual trigger

jobs:
  update-theme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set random theme
      run: |
        THEMES=("default" "transparent" "shadow_red" "shadow_green" "shadow_blue" "dark" "radical" "merko" "gruvbox" "gruvbox_light" "tokyonight" "onedark" "cobalt" "synthwave" "highcontrast" "dracula" "prussian" "monokai" "vue" "vue-dark" "shades-of-purple" "nightowl" "buefy" "blue-green" "algolia" "great-gatsby" "darcula" "bear" "solarized-dark" "solarized-light" "chartreuse-dark" "nord" "gotham" "material-palenight" "graywhite" "vision-friendly-dark" "ayu-mirage" "midnight-purple" "calm" "flag-india" "omni" "react" "jolly" "maroongold" "yeblu" "blueberry" "slateorange" "kacho_ga" "outrun" "ocean_dark" "city_lights" "github_dark" "github_dark_dimmed" "discord_old_blurple" "aura_dark" "panda" "noctis_minimus" "cobalt2" "swift" "aura" "apprentice" "moltack" "codeSTACKr" "rose_pine" "catppuccin_latte" "catppuccin_mocha" "date_night" "one_dark_pro" "rose" "holi" "neon" "blue_navy" "calm_pink" "ambient_gradient")
        RANDOM_THEME=${THEMES[$RANDOM % ${#THEMES[@]}]}
        echo "Random theme selected: $RANDOM_THEME"
        echo "THEME=$RANDOM_THEME" >> $GITHUB_ENV

    - name: Update README
      run: |
        sed -i '/github-readme-stats/ s|theme=[^&]*|theme='$THEME'|' README.md
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "Update GitHub stats theme to $THEME"
        git push
